# 🥇 Gold Relay v2 — تاريخ الذهب من CoinGecko (ياهو مقفول 429 على سيرفرات GitHub — تشخيص مؤكد من فرع diag)
name: 🥇 Gold Relay — تاريخ الذهب وعوامله
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gold-relay
  cancel-in-progress: true

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: بناء تاريخ الذهب من CoinGecko (pax-gold ≈ الأونصة بدقة ~0.3%)
        shell: bash
        run: |
          set -euo pipefail
          OUT=gold.json
          EGP=""
          # سعر الدولار/جنيه من نفس المصدر (pax-gold بالدولار والجنيه) — fallback: open.er-api
          SP=$(curl -fsS --retry 2 --max-time 25 "https://api.coingecko.com/api/v3/simple/price?ids=pax-gold&vs_currencies=usd,egp" || echo "")
          if [ -n "$SP" ]; then
            EGP=$(echo "$SP" | jq -r '."pax-gold".egp / ."pax-gold".usd' 2>/dev/null || echo "")
          fi
          if [ -z "$EGP" ] || [ "$EGP" = "null" ]; then
            EGP=$(curl -fsS --retry 2 --max-time 20 "https://open.er-api.com/v6/latest/USD" | jq -r '.rates.EGP' || echo "")
          fi
          echo "INFO USD/EGP = $EGP"
          if [ -z "$EGP" ] || [ "$EGP" = "null" ]; then
            echo "ERR مفيش سعر دولار/جنيه — مش هنكمل"
            exit 1
          fi

          # الطريق الأول: market_chart كامل في استدعاء واحد
          if curl -fsS --retry 2 --max-time 30 "https://api.coingecko.com/api/v3/coins/pax-gold/market_chart?vs_currency=usd&days=365&interval=daily" -o /tmp/mc.json 2>/dev/null \
             && jq -e '.prices | length > 100' /tmp/mc.json >/dev/null 2>&1; then
            jq --arg egp "$EGP" '{ "XAUUSD=X": { close: (.prices | map(.[1])) }, "USDEGP=X": { close: [(($egp|tonumber)*1.0, ($egp|tonumber))] } }' /tmp/mc.json > "$OUT"
            echo "OK market_chart: $(jq '."XAUUSD=X".close | length' "$OUT") نقطة سعر"
          else
            # الطريق التاني: تاريخ يوم بيوم (60 يوم)
            echo "WARN market_chart مرفوض — بنسحب يوم بيوم"
            : > /tmp/closes.txt
            START=$(date -u -d "61 days ago" +%s)
            for i in $(seq 0 60); do
              D=$(date -u -d "@$((START + i*86400))" +%d-%m-%Y)
              P=$(curl -fsS --retry 1 --max-time 15 "https://api.coingecko.com/api/v3/coins/pax-gold/history?date=$D&localization=false" 2>/dev/null | jq -r '.market_data.current_price.usd // empty' 2>/dev/null) || true
              if [ -n "$P" ]; then echo "$P" >> /tmp/closes.txt; fi
              sleep 2
            done
            if [ -s /tmp/closes.txt ]; then
              echo "{\"XAUUSD=X\":{\"close\":[$(paste -sd, /tmp/closes.txt)]},\"USDEGP=X\":{\"close\":[$EGP,$EGP]}}" > "$OUT"
              echo "OK day-by-day: $(wc -l < /tmp/closes.txt) نقطة سعر"
            else
              echo "ERR CoinGecko رفض الطريقتين"
              exit 1
            fi
          fi
          jq -e '."XAUUSD=X".close | length > 10' "$OUT" >/dev/null || { echo "ERR gold.json صيغة غلط"; exit 1; }

      - name: نشر gold.json على فرع gold
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f gold.json ] || { echo "no gold.json"; exit 0; }
          mkdir -p /tmp/pub
          cp gold.json /tmp/pub/
          cd /tmp/pub
          git init -q -b gold
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "chore: gold update from coingecko [skip ci]"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/MedhatCoding/mistral-Mi.git" gold
          echo "OK gold.json published"
