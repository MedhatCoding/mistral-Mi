# mistral-Mi APK — البناء الحالي بيشمّل تصميم v3.91 (٥ تابات + لوجو + شعارات) — الموقع نفسه بيتحدث أوتوماتيك، الـ APK بيلفه زي ما هو
name: Build APK (mistral-Mi)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/apk-build.yml', 'logo.svg']
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure Android SDK pieces
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" 'platforms;android-34' 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0' >/dev/null 2>&1 || true
          else
            echo 'sdkmanager مش موجود في المسار المتوقع — هستخدم SDK الجاهز على الـ runner'
          fi
      - name: Create Capacitor wrapper app
        run: |
          mkdir -p app/www
          echo '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>' > app/www/index.html
          cd app
          npm init -y >/dev/null
          npm install @capacitor/cli @capacitor/core @capacitor/android sharp --no-audit --no-fund --silent
          cat > capacitor.config.json <<'CAP_EOF'
          {
            "appId": "com.medhat.mistralmi",
            "appName": "mistral-Mi",
            "webDir": "www",
            "server": { "url": "https://mistral-mi.streamlit.app/" }
          }
          CAP_EOF
          npx cap add android
          sed -i 's/#FFFFFF/#0a0f1c/g' android/app/src/main/res/values/*.xml || true
          # 🔔 Firebase: تفعيل إشعارات FCM على التليفون
          cp ../google-services.json android/app/google-services.json
          sed -i '0,/^dependencies {/s//dependencies {\nclasspath "com.google.gms:google-services:4.4.2"/' android/build.gradle
          printf "\napply plugin: 'com.google.gms.google-services'\ndependencies { implementation 'com.google.firebase:firebase-messaging:24.1.0' }\n" >> android/app/build.gradle
          MFILE="android/app/src/main/java/com/medhat/mistralmi/MainActivity.java"
          grep -q "import com.google.firebase" "$MFILE" || sed -i '0,/^package /s/package \(.*\)/package \1\nimport com.google.firebase.messaging.FirebaseMessaging;/' "$MFILE"
          sed -i 's|super.onCreate(savedInstanceState);|super.onCreate(savedInstanceState);\n        try{FirebaseMessaging.getInstance().subscribeToTopic("mistral-mi");}catch(Exception x){}|' "$MFILE"
          grep -q subscribeToTopic "$MFILE" || sed -i 's|public class MainActivity extends BridgeActivity {|public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        try{com.google.firebase.messaging.FirebaseMessaging.getInstance().subscribeToTopic("mistral-mi");}catch(Exception x){}\n    }|' "$MFILE"
          grep -q subscribeToTopic "$MFILE" && echo '✅ التطبيق هيتعرف على إشعارات Firebase ويسجل في topic mistral-mi' || { echo '❌ فشل حقن كود الإشعارات'; cat "$MFILE"; exit 1; }
      - name: Build mistral-Mi icons (logo + dark background)
        run: |
          cd app
          cat > icons.js <<'ICO_EOF'
          const sharp=require('sharp');
          const fs=require('fs');
          (async()=>{
            const dens=[['mdpi',48,108],['hdpi',72,162],['xhdpi',96,216],['xxhdpi',144,324],['xxxhdpi',192,432]];
            for(const [d,sz,fg] of dens){
              const dir='android/app/src/main/res/mipmap-'+d;
              const sq=await sharp('../logo.svg',{density:300}).resize(sz,sz).png().toBuffer();
              fs.writeFileSync(dir+'/ic_launcher.png',sq);
              fs.writeFileSync(dir+'/ic_launcher_round.png',sq);
              const inner=Math.round(fg*0.58);
              const logo=await sharp('../logo.svg',{density:300}).resize(inner,inner).png().toBuffer();
              const fgbuf=await sharp({create:{width:fg,height:fg,channels:4,background:{r:0,g:0,b:0,alpha:0}}}).composite([{input:logo,gravity:'centre'}]).png().toBuffer();
              fs.writeFileSync(dir+'/ic_launcher_foreground.png',fgbuf);
            }
            console.log('✅ أيقونات mistral-Mi اتعملت بكل المقاسات');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          ICO_EOF
          node icons.js
      - name: Build debug APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          cd app/android && chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -400 > /tmp/gradle.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" != "0" ]; then
            echo "gradle exit=$EXIT bytes=$(wc -c < /tmp/gradle.log)"
            cat /tmp/gradle.log
            printf 'exit code: %s\n```\n' "$EXIT" > /tmp/body.txt
            head -c 55000 /tmp/gradle.log >> /tmp/body.txt
            printf '\n```\n' >> /tmp/body.txt
            gh issue create --repo "$REPO" --title "🩺 Gradle build log (run $GITHUB_RUN_ID)" --body-file /tmp/body.txt && echo 'LOG_ISSUE_PUBLISHED' || echo 'LOG_ISSUE_FAILED'
            exit 1
          fi

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: mistral-mi-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
