name: Build APK (mistral-Mi)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/apk-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure Android SDK pieces
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null
      - name: Create Capacitor wrapper app
        run: |
          mkdir -p app/www
          echo '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>' > app/www/index.html
          cd app
          npm init -y >/dev/null
          npm install @capacitor/cli @capacitor/core @capacitor/android --no-audit --no-fund --silent
          cat > capacitor.config.json <<'CAP_EOF'
          {
            "appId": "com.medhat.mistralmi",
            "appName": "mistral-Mi",
            "webDir": "www",
            "server": { "url": "https://mistral-mi.streamlit.app/" }
          }
          CAP_EOF
          npx cap add android
          sed -i 's/#FFFFFF/#0a0f1c/g' android/app/src/main/res/values/*.xml || true
      - name: Build debug APK
        run: cd app/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
      - uses: actions/upload-artifact@v4
        with:
          name: mistral-mi-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
